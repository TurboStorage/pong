<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A two-player browser Pong game by Eyes on Flash." />
    <title>Pong | Eyes on Flash</title>
    <link rel="stylesheet" href="./style.css" />
    <script src="./analytics.js" async></script>
  </head>
  <body>
    <main class="game-shell">
      <header>
        <a class="brand" href="https://eyesonflash.com/software/">Eyes on Flash</a>
        <p>Browser arcade edition</p>
      </header>
      <canvas id="game" width="960" height="600" aria-label="Two-player Pong game"></canvas>
      <p class="instructions"><b>Player 1</b> W / S &nbsp; <b>Player 2</b> ↑ / ↓ &nbsp; <b>Space</b> start or pause &nbsp; <b>F</b> fullscreen</p>
    </main>
    <script src="./game.js"></script>
  </body>
</html>
